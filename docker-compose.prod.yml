version: '3.9'

services:
  postgres:
    image: postgres:17-alpine
    container_name: isai_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: isai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: isai_pruebas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U isai']
      interval: 10s
      timeout: 5s
      retries: 5
    # Sin "ports:" a propósito — no se expone al exterior, solo red interna.

  redis:
    image: redis:7-alpine
    container_name: isai_redis_prod
    restart: unless-stopped
    volumes:
      - redisdata:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: isai_api_prod
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: isai_web_prod
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    depends_on:
      - api
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
